[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rab-scenario-classification"
version = "0.1.0"
description = "Unsupervised organization and evaluation of RAB trigger events"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
